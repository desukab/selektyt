<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SelekyT · shell</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header>
  <h1>SelekyT</h1>
  <span id="engine" class="muted">connecting…</span>
</header>
<main>
  <section class="controls">
    <button id="analyze-sample" class="primary">Analyze sample WAV</button>
    <label class="file">
      <input type="file" id="file-input" accept="audio/wav,.wav" hidden />
      <span>or choose a WAV on disk</span>
    </label>
    <button id="export-fcpxml">Export FCPXML</button>
    <label class="slider">
      threshold
      <input type="range" id="threshold" min="0.10" max="0.9" step="0.01" value="0.5" />
      <output id="threshold-out">0.50</output>
    </label>
  </section>
  <section id="status" class="status muted">Select a source to begin.</section>
  <section class="canvas-wrap"><canvas id="scores" width="1200" height="240"></canvas></section>
  <section id="cutlist" class="cutlist" hidden>
    <div class="cutlist-head">
      <span>cutlist</span>
      <label class="slider">pad <input type="number" id="pad" min="0" max="1" step="0.05" value="0.3" style="width:4.5ch" /></label>
      <span id="cutlist-summary" class="muted"></span>
    </div>
    <div id="cutlist-blocks" class="blocks"></div>
  </section>
  <section class="meta">
    <dl id="audit">
      <div><dt>backend</dt><dd id="m-backend">—</dd></div>
      <div><dt>vad model</dt><dd id="m-model">—</dd></div>
      <div><dt>fallback</dt><dd id="m-fallback">—</dd></div>
      <div><dt>hysteresis</dt><dd id="m-hyst">—</dd></div>
      <div><dt>frames</dt><dd id="m-frames">—</dd></div>
      <div><dt>duration</dt><dd id="m-dur">—</dd></div>
      <div><dt>segments</dt><dd id="m-segs">—</dd></div>
    </dl>
    <pre id="meta-detail" class="detail"></pre>
  </section>
  <section id="export-panel" class="export" hidden>
    <div class="cutlist-head"><span>editorial export</span><span id="export-summary" class="muted"></span></div>
    <div id="export-links" class="links"></div>
  </section>
</main>
<script type="module" src="/app.mjs"></script>
</body>
</html>
