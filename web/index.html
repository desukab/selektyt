<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SelekyT · shell</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header>
  <h1>SelekyT</h1>
  <span id="engine" class="muted">connecting…</span>
</header>
<main>
  <section class="controls">
    <button id="analyze-sample" class="primary">Analyze sample WAV</button>
    <label class="file">
      <input type="file" id="file-input" accept="audio/wav,.wav" hidden />
      <span>or choose a WAV on disk</span>
    </label>
    <button id="export-fcpxml">Export FCPXML</button>
    <label class="slider">
      threshold
      <input type="range" id="threshold" min="0.10" max="0.9" step="0.01" value="0.5" />
      <output id="threshold-out">0.50</output>
    </label>
  </section>
  <section id="status" class="status muted">Select a source to begin.</section>
  <section class="canvas-wrap"><canvas id="scores" width="1200" height="240"></canvas></section>
  <section id="cutlist" class="cutlist" hidden>
    <div class="cutlist-head">
      <span>cutlist</span>
      <label class="slider">pad <input type="number" id="pad" min="0" max="1" step="0.05" value="0.3" style="width:4.5ch" /></label>
      <span id="cutlist-summary" class="muted"></span>
    </div>
    <div id="cutlist-blocks" class="blocks"></div>
  </section>
  <section class="cuts">
    <div class="cutlist-head">
      <span>video → social cuts</span>
      <span id="cuts-summary" class="muted">transcribe · select · cut · render</span>
    </div>
    <div class="cuts-controls">
      <input id="cuts-source" type="text" placeholder="out/web/uploads/name.mp4 — or https://youtu.be/…" />
      <label class="file" title="Upload a video or audio file; it lands in out/web/uploads and the path fills in above.">
        <input type="file" id="cuts-file" accept="video/*,audio/*" hidden />
        <span>or upload a file</span>
      </label>
      <label class="slider">clips
        <input type="number" id="cuts-limit" min="1" max="20" step="1" value="6" style="width:5ch" />
      </label>
      <label class="slider">model
        <select id="cuts-model">
          <option value="tiny">tiny</option>
          <option value="base">base</option>
          <option value="small" selected>small</option>
          <option value="medium">medium</option>
        </select>
      </label>
      <label class="slider">captions
        <select id="cuts-caption-style">
          <option value="minimal" selected>minimal</option>
          <option value="punch">punch</option>
          <option value="spotlight">spotlight</option>
          <option value="noir">noir</option>
        </select>
      </label>
      <label class="check" title="Also run the VAD-driven jump-cut analysis and write out/audio/">
        <input type="checkbox" id="cuts-audio-analysis" />
        audio analysis
      </label>
      <label class="slider" title="Only needed when YouTube asks for sign-in. Path to a cookies file outside the repo — it is never uploaded.">
        cookies file
        <input id="cuts-cookies" type="text" placeholder="~/.config/cookies.txt" />
      </label>
      <button id="cuts-run" class="primary">Make cuts</button>
    </div>
    <div id="cuts-links" class="links"></div>
  </section>

  <section class="meta">
    <dl id="audit">
      <div><dt>backend</dt><dd id="m-backend">—</dd></div>
      <div><dt>vad model</dt><dd id="m-model">—</dd></div>
      <div><dt>fallback</dt><dd id="m-fallback">—</dd></div>
      <div><dt>hysteresis</dt><dd id="m-hyst">—</dd></div>
      <div><dt>frames</dt><dd id="m-frames">—</dd></div>
      <div><dt>duration</dt><dd id="m-dur">—</dd></div>
      <div><dt>segments</dt><dd id="m-segs">—</dd></div>
    </dl>
    <pre id="meta-detail" class="detail"></pre>
  </section>
  <section id="export-panel" class="export" hidden>
    <div class="cutlist-head"><span>editorial export</span><span id="export-summary" class="muted"></span></div>
    <div id="export-links" class="links"></div>
  </section>
</main>
<script type="module" src="/app.mjs"></script>
</body>
</html>
