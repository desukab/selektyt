name: CI

on:
  push:
    branches: [main]
  pull_request:

# Keeps the mechanical core (Rust) and the intelligence core (Python) green and
# warning-free on plain Linux x64, which is also the Tauri shell's target.
#
# The wired cross-language parity test (tests/test_sidecar_parity.py) spawns the
# compiled `selekyt-mech` binary, so the Rust job builds it once and the Python
# job reuses the artifact rather than rebuilding.

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build (release)
        run: cargo build --release --all-targets --locked
      - name: Clippy (warnings denied — the 0-warning mandate)
        run: cargo clippy --release --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --release --locked
      - name: Upload sidecar binary
        uses: actions/upload-artifact@v4
        with:
          name: selekyt-mech
          path: rust/target/release/selekyt-mech
          if-no-files-found: error

  python:
    runs-on: ubuntu-latest
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg / ffprobe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install the fonts the caption-burn coverage check resolves
        # The render refuses to burn captions no installed font can draw
        # (engine/render.py, _check_caption_coverage), and it resolves that
        # question with the same `fc-list` fontconfig scan libass uses. The
        # hosted image has no Indic font, so without this the Telugu end-to-end
        # hits the refusal and the suite reports a host limitation as a product
        # defect. fonts-noto-core is the package the refusal message itself
        # names; it provides Noto Sans Telugu.
        run: sudo apt-get install -y --no-install-recommends fonts-noto-core
      - name: Download the sidecar built by the rust job
        uses: actions/download-artifact@v4
        with:
          name: selekyt-mech
          path: ${{ github.workspace }}/rust/target/release
      - name: Make sidecar executable
        run: chmod +x rust/target/release/selekyt-mech
      - name: Install package (test + LLM + NLE audit deps)
        # The suite is installed WITH its declared dependencies, not --no-deps.
        # faster-whisper, av, onnxruntime, static-ffmpeg and yt-dlp are all base
        # dependencies in pyproject.toml — not optional drivers — and roughly a
        # fifth of the suite exercises them directly: the pipeline's
        # select_engine preflight (selekyt/pipeline.py) raises before a run
        # starts when no engine is importable, and `selekyt --doctor` hard-requires
        # onnxruntime, the vendored Silero model, pycmx and opentimelineio.
        # A --no-deps install removed those and turned 76 passing tests into
        # preflight RuntimeErrors plus doctor exit-code failures, which is not
        # isolation from the clean-install contract — it is the suite run against
        # an install state the package never declares. The clean-install contract
        # itself is still proven separately by pypi-install below, which installs
        # only the built wheel into a fresh venv.
        # requests is imported at collection time via engine.llm_editorial;
        # pycmx is the independent CMX 3600 reader that
        # tools/nle_check.py uses to parse SelekyT's own EDL with a parser it
        # did not write. Without it that check FAILS rather than skipping, so
        # the extra is installed here to keep the independent audit live in CI.
        # pyyaml is the same shape for the release workflows:
        # tests/test_desktop_packaging.py reads build-windows.yml to pin the
        # signed/unsigned artifact label, and errors at setup without it.
        # huggingface_hub, also in the dev extra, is what
        # tests/test_collapse_hub_cache.py asks to resolve a collapsed staged
        # cache offline — the check only means something against the real
        # library, so it stays installed here rather than skipping.
        # Pillow is test-only and undeclared in the metadata: the caption
        # safe-area suite measures the rendered PNG to count visible caption
        # lines, and without the imaging library those measurements error rather
        # than skip. It is installed here so the measurements run; the suite
        # still guards itself for a host without it.
        # numpy and opencv are reached at collection time (conftest imports
        # numpy, and the caption/reframe tests pull cv2 through engine.reframe
        # and engine.caption_font) and come in with the base install above.
        run: |
          pip install -e ".[dev,llm,nle]"
          pip install "pillow>=10"
      - name: Node (for the web shell harness tests)
        run: node --version
      - name: Pytest
        env:
          SELEKYT_MECH: ${{ github.workspace }}/rust/target/release/selekyt-mech
        # -rs surfaces skip reasons so a silently-skipped suite never passes
        # as green without coverage (the harness tests need node on PATH).
        run: python -m pytest tests/ -q -rs
      - name: Desktop UI syntax and grammar
        # The UI is plain HTML/CSS/ES modules with no build step, so a syntax
        # check plus the project-independent parser checks are the cheapest
        # guard against a change that only fails once the app is installed.
        run: |
          node --check apps/desktop/ui/app.mjs
          node --check apps/desktop/ui/lib.mjs
          node tests/ui_contract.mjs

  shell:
    # The Tauri shell: the webview host the Windows installer ships. It compiles
    # on Linux here (webkit2gtk is on the hosted runner's image) so the Rust
    # added for the desktop app is type- and borrow-checked before the Windows
    # job spends 25 minutes and a ~1 GB download on it.
    runs-on: ubuntu-latest
    env:
      # tauri_build::build() runs from build.rs on every `cargo check`, and it
      # hard-errors if the paths tauri.conf.json declares are absent —
      # `resource path 'binaries/selekyt-mech-x86_64-unknown-linux-gnu' doesn't
      # exist`. Those paths are produced by apps/desktop/stage-windows.sh,
      # which downloads a python-build-standalone interpreter, ffmpeg and ~500 MB
      # of whisper weights. Requiring that here would defeat the point of the
      # job, so TAURI_CONFIG patches the two staging-dependent keys out for this
      # job only. tauri-build merges it as an RFC 7386 patch, which is why the
      # values are null and not empty: an empty object *recurses* and leaves the
      # target untouched (verified — that was the first attempt, and it still
      # errored on resources/python), whereas null deletes the key.
      # Everything this job gives up is still covered: the Windows job stages
      # for real and then bundles against the unpatched config, so a path that
      # cannot resolve fails there.
      TAURI_CONFIG: '{"bundle":{"externalBin":null,"resources":null}}'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install the webview dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Cache the shell workspace
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
      - name: Check (validates the patched config through codegen)
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked
      - name: Clippy (warnings denied)
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Unit tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

  pypi-install:
    # This is the hard clean-install product gate. It builds the exact Linux
    # platform wheel that the release workflow publishes, installs only that
    # wheel into a brand-new venv, and runs the real runtime plus media path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build tools
        run: python -m pip install --upgrade pip build
      - name: Install ffmpeg / ffprobe
        # Present as the first-choice resolver for the real render path. The
        # static-ffmpeg fallback is proven separately below, so this job does
        # not depend on it silently working.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Prepare every packaged runtime asset
        # Builds the sidecar from the Cargo workspace at rust/ and stages it at
        # the path the wheel vendors it from; fails the job naming anything
        # missing rather than building a wheel that silently lacks it.
        run: python tools/prepare_release_assets.py
      - name: Build the release wheel
        env:
          SELEKYT_RELEASE_BUILD: "1"
        run: python -m build --wheel --outdir dist
      - name: Inspect the wheel as the product artifact
        run: |
          python - <<'PY'
          import zipfile, glob
          wheel = glob.glob("dist/*.whl")
          assert len(wheel) == 1, wheel
          wheel = wheel[0]
          # Deliberately portable: a platform tag would deny the editorial
          # engine to macOS/Windows/aarch64 hosts for the sake of one binary
          # that nothing on the pipeline's critical path requires.
          assert wheel.endswith("-py3-none-any.whl"), wheel
          with zipfile.ZipFile(wheel) as z:
              names = set(z.namelist())
              required = {
                  "engine/models/silero_vad_v6.onnx",
                  "engine/models/face_detection_yunet.onnx",
                  "engine/models/whisper_tiny/model.bin",
                  "engine/models/whisper_tiny/tokenizer.json",
                  "engine/models/whisper_tiny/config.json",
                  "engine/models/whisper_tiny/LICENSE",
                  "engine/models/whisper_tiny/PROVENANCE.md",
                  "engine/bin/selekyt-mech",
                  "third_party/otio_fcpxml_adapter/fcpxml.py",
                  "third_party/otio_fcpxml_adapter/LICENSE",
              }
              missing = sorted(required - names)
              assert not missing, missing
              meta = z.read(next(n for n in names if n.endswith(".dist-info/METADATA"))).decode()
              for dep in ("faster-whisper", "av", "onnxruntime", "static-ffmpeg",
                          "pycmx", "opentimelineio"):
                  assert f"Requires-Dist: {dep}" in meta, dep
              # The pin that keeps faster-whisper 1.2.1 runnable.
              assert "Requires-Dist: av<19,>=11" in meta, "av<19 upper bound missing"
          print("wheel contract: PASS")
          PY
      - name: Install only the wheel into a clean environment
        run: |
          rm -rf /tmp/selekyt-clean
          python -m venv /tmp/selekyt-clean
          /tmp/selekyt-clean/bin/python -m pip install --upgrade pip
          /tmp/selekyt-clean/bin/python -m pip install dist/*.whl
          /tmp/selekyt-clean/bin/python -m pip install "pytest>=8" build
          # `build` is what the release packaging contract test invokes to
          # construct the wheel its assertions inspect. Under
          # SELEKYT_RELEASE_BUILD a missing backend is a hard failure rather
          # than a skip — the skip would publish a wheel whose contents were
          # never checked — so it has to be in this venv.
      - name: Prove imports and installed paths are clean
        run: |
          cd /tmp
          /tmp/selekyt-clean/bin/python - <<'PY'
          import engine, selekyt
          import onnxruntime, faster_whisper, pycmx, opentimelineio, static_ffmpeg
          from engine.vad import SileroVADBackend, get_vad_backend
          from selekyt.runtime import bundled_mech_path, bundled_whisper_model, ping_mech
          # engine ships as a namespace package, so engine.__file__ is None and
          # an "in engine.__file__" check raises instead of asserting anything.
          # selekyt is a regular package installed beside it, so its directory is
          # where both came from — and had the checkout leaked onto sys.path,
          # that directory would be the source tree, not this venv.
          import os as _os
          _pkgs = _os.path.dirname(_os.path.dirname(selekyt.__file__))
          assert _pkgs.startswith("/tmp/selekyt-clean"), \
              f"selekyt resolved from {_pkgs}, not the clean venv"
          assert _os.path.isdir(_os.path.join(_pkgs, "engine")), \
              "engine is not installed beside selekyt"
          assert SileroVADBackend().is_available()
          assert get_vad_backend().name == "silero"
          assert bundled_whisper_model() is not None
          assert bundled_mech_path() is not None
          assert ping_mech()["pong"] is True
          print("clean installed runtime: PASS")
          PY
          /tmp/selekyt-clean/bin/selekyt --version
          /tmp/selekyt-clean/bin/selekyt --doctor
      - name: Prove the install works with no system ffmpeg
        # The claim is that a machine with no ffmpeg installed is still usable.
        # This host has one (installed above as the first-choice resolver), so
        # the claim is only testable in an environment where PATH cannot reach
        # it. static_ffmpeg does not ship its binaries in the wheel — it
        # downloads them on first add_paths(), and that download is skipped
        # entirely when a system ffmpeg already answers, so
        # _static_ffmpeg_bin() is expected to be empty here rather than
        # evidence of a broken install. The static-ffmpeg rung is the only one
        # left in this env; resolving and executing it is the real proof.
        run: |
          cd /tmp
          env -i PATH="/tmp/selekyt-clean/bin" HOME="$HOME" \
          /tmp/selekyt-clean/bin/python - <<'PY'
          import shutil, subprocess
          assert shutil.which("ffmpeg") is None, \
              "ffmpeg is still reachable, so this is not exercising the fallback"
          from providers.ffmpeg import ffmpeg_bin, ffprobe_bin
          ff = ffmpeg_bin()
          probe = subprocess.run([ff, "-version"], capture_output=True, text=True)
          assert probe.returncode == 0, \
              f"the fallback ffmpeg is not runnable: {(probe.stderr or '')[:200]}"
          assert subprocess.run([ffprobe_bin(), "-version"],
                                capture_output=True, text=True).returncode == 0
          print("no-system-ffmpeg fallback resolves ->", ff)
          print("no-system-ffmpeg fallback: PASS")
          PY
      - name: Run the release packaging contract tests
        env:
          SELEKYT_RELEASE_BUILD: "1"
        # From /tmp rather than the checkout: the interpreter that has pytest is
        # the clean venv, not the checkout's own. Running this from the source
        # tree used the checkout's python, which has no pytest — the step
        # installed it only into /tmp/selekyt-clean. The tests build a wheel
        # from $GITHUB_WORKSPACE themselves, so the working directory is not
        # what selects the code under test.
        run: |
          cd /tmp
          /tmp/selekyt-clean/bin/python -m pytest "$GITHUB_WORKSPACE/tests/test_pypi_packaging.py" -q
      - name: Run the real installed Silero regression suite
        env:
          SELEKYT_RELEASE_BUILD: "1"
        run: |
          cd /tmp
          /tmp/selekyt-clean/bin/python -m pytest "$GITHUB_WORKSPACE/tests/test_vad_silero.py" -q
      - name: Download real speech video
        run: |
          curl -L --fail --retry 3             "https://commons.wikimedia.org/wiki/Special:Redirect/file/Philip%20Nelson%20Interview.webm"             -o /tmp/release-real.webm
          ffmpeg -y -v error -ss 0 -t 45 -i /tmp/release-real.webm -c copy /tmp/release-sample.webm
      - name: Run the real local end-to-end product
        run: |
          cd /tmp
          /tmp/selekyt-clean/bin/selekyt /tmp/release-sample.webm --model tiny --limit 1 --audio-analysis --out /tmp/release-e2e
          test -f /tmp/release-e2e/project/facebook/01.mp4
          test -f /tmp/release-e2e/project/shorts/01.mp4
          test -f /tmp/release-e2e/project/timeline/01.edl
          test -f /tmp/release-e2e/project/timeline/01.fcpxml
          test -f /tmp/release-e2e/project/captions/01.ass
          /tmp/selekyt-clean/bin/python "$GITHUB_WORKSPACE/tools/nle_check.py" /tmp/release-e2e/project | tee /tmp/nle-check.txt
          ! grep -q "SKIP" /tmp/nle-check.txt
          if grep -RqiE "pycmx (absent|missing)|FCPXML reader (absent|missing)|vad ffmpeg" /tmp/release-e2e/project; then
            echo "release-critical runtime warning found"
            exit 1
          fi
