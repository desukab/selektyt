name: CI

on:
  push:
    branches: [main]
  pull_request:

# Keeps the mechanical core (Rust) and the intelligence core (Python) green and
# warning-free on plain Linux x64, which is also the Tauri shell's target.
#
# The wired cross-language parity test (tests/test_sidecar_parity.py) spawns the
# compiled `selekyt-mech` binary, so the Rust job builds it once and the Python
# job reuses the artifact rather than rebuilding.

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build (release)
        run: cargo build --release --all-targets --locked
      - name: Clippy (warnings denied — the 0-warning mandate)
        run: cargo clippy --release --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --release --locked
      - name: Upload sidecar binary
        uses: actions/upload-artifact@v4
        with:
          name: selekyt-mech
          path: rust/target/release/selekyt-mech
          if-no-files-found: error

  python:
    runs-on: ubuntu-latest
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg / ffprobe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Download the sidecar built by the rust job
        uses: actions/download-artifact@v4
        with:
          name: selekyt-mech
          path: ${{ github.workspace }}/rust/target/release
      - name: Make sidecar executable
        run: chmod +x rust/target/release/selekyt-mech
      - name: Install package (test + LLM + NLE audit deps)
        # requests is imported at collection time via engine.llm_editorial;
        # faster-whisper and sherpa-onnx are transcription backends that are
        # imported lazily and are deliberately optional extras here. The
        # sherpa backend's missing-library and missing-model error paths are
        # pinned by tests/test_sherpa.py without needing the wheel, so CI
        # stays green on hosts where neither engine is installed.
        # pycmx is the independent CMX 3600 reader that
        # tools/nle_check.py uses to parse SelekyT's own EDL with a parser it
        # did not write. Without it that check FAILS rather than skipping, so
        # the extra is installed here to keep the independent audit live in CI.
        # pyyaml is the same shape for the release workflows:
        # tests/test_desktop_packaging.py reads build-windows.yml to pin the
        # signed/unsigned artifact label, and errors at setup without it.
        # huggingface_hub, also in the dev extra, is what
        # tests/test_collapse_hub_cache.py asks to resolve a collapsed staged
        # cache offline — the check only means something against the real
        # library, so it stays installed here rather than skipping.
        # The source regression matrix deliberately keeps heavyweight runtime
        # engines out of the test environment. Their clean-install contract is
        # exercised separately by pypi-install below against the built wheel.
        # This prevents optional-driver presence from silently turning historical
        # environment-gated tests into a different suite.
        run: |
          pip install -e . --no-deps
          pip install "pytest>=8" "pycmx>=1.5" "opentimelineio>=0.17.0" "pyyaml>=6" "huggingface_hub>=0.23" "requests>=2.31"
      - name: Node (for the web shell harness tests)
        run: node --version
      - name: Pytest
        env:
          SELEKYT_MECH: ${{ github.workspace }}/rust/target/release/selekyt-mech
        # -rs surfaces skip reasons so a silently-skipped suite never passes
        # as green without coverage (the harness tests need node on PATH).
        run: python -m pytest tests/ -q -rs
      - name: Desktop UI syntax and grammar
        # The UI is plain HTML/CSS/ES modules with no build step, so a syntax
        # check plus the project-independent parser checks are the cheapest
        # guard against a change that only fails once the app is installed.
        run: |
          node --check apps/desktop/ui/app.mjs
          node --check apps/desktop/ui/lib.mjs
          node tests/ui_contract.mjs

  shell:
    # The Tauri shell: the webview host the Windows installer ships. It compiles
    # on Linux here (webkit2gtk is on the hosted runner's image) so the Rust
    # added for the desktop app is type- and borrow-checked before the Windows
    # job spends 25 minutes and a ~1 GB download on it.
    runs-on: ubuntu-latest
    env:
      # tauri_build::build() runs from build.rs on every `cargo check`, and it
      # hard-errors if the paths tauri.conf.json declares are absent —
      # `resource path 'binaries/selekyt-mech-x86_64-unknown-linux-gnu' doesn't
      # exist`. Those paths are produced by apps/desktop/stage-windows.sh,
      # which downloads a python-build-standalone interpreter, ffmpeg and ~500 MB
      # of whisper weights. Requiring that here would defeat the point of the
      # job, so TAURI_CONFIG patches the two staging-dependent keys out for this
      # job only. tauri-build merges it as an RFC 7386 patch, which is why the
      # values are null and not empty: an empty object *recurses* and leaves the
      # target untouched (verified — that was the first attempt, and it still
      # errored on resources/python), whereas null deletes the key.
      # Everything this job gives up is still covered: the Windows job stages
      # for real and then bundles against the unpatched config, so a path that
      # cannot resolve fails there.
      TAURI_CONFIG: '{"bundle":{"externalBin":null,"resources":null}}'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install the webview dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Cache the shell workspace
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
      - name: Check (validates the patched config through codegen)
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked
      - name: Clippy (warnings denied)
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Unit tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

  pypi-install:
    # This job deliberately has no apt-installed FFmpeg and no editable checkout
    # on PYTHONPATH. It is the release gate that proves the wheel is a usable
    # product after a plain pip install, rather than only inside the repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/selekyt-clean
          /tmp/selekyt-clean/bin/python -m pip install --upgrade pip
          /tmp/selekyt-clean/bin/python -m pip install dist/selekyt-*.whl
          /tmp/selekyt-clean/bin/python -m pip install "pytest>=8"
      - name: Exercise the installed product
        run: |
          /tmp/selekyt-clean/bin/selekyt --version
          /tmp/selekyt-clean/bin/selekyt --doctor
          /tmp/selekyt-clean/bin/python - <<'PY'
          import wave
          from pathlib import Path
          from engine.vad import get_vad_backend
          
          path = Path("/tmp/silence.wav")
          with wave.open(str(path), "wb") as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(16000)
              wav.writeframes(b"\x00\x00" * 16000)
          
          backend = get_vad_backend()
          assert backend.name == "silero", backend.name
          result = backend.analyze(path)
          assert result.backend == "silero"
          assert result.vad_model == "silero-v6"
          assert result.scores
          print("clean PyPI install: Silero VAD PASS")
      - name: Exercise the real installed Silero regression suite
        run: |
          cd /tmp
          /tmp/selekyt-clean/bin/python -m pytest "$GITHUB_WORKSPACE/tests/test_vad_silero.py" -q
          PY
