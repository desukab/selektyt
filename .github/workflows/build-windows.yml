name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign the build (requires the SELEKYT_AZURE_* secrets)"
        required: false
        default: "0"

# Produces the real Windows x64 installer: an NSIS setup and an MSI, both
# carrying the Tauri shell, the `selekyt-mech` Rust sidecar, a bundled
# python-build-standalone interpreter with the SelekyT package installed into
# it, LGPL ffmpeg/ffprobe and the staged faster-whisper `small` weights, so a
# first run transcribes with no network.
#
# Everything the installer needs besides the shell itself is staged by
# apps/desktop/stage-windows.sh, which exits non-zero on any missing piece — a
# tauri build with a half-staged tree would otherwise ship a broken app.
#
# The whole job is a single windows-latest runner because the interpreter tree,
# the weights and ffmpeg are GBs of Windows-only binaries: nothing here is
# worth caching across machines as an artifact.
#
# Signing is wired but inert. `bundle.windows.signCommand` runs scripts/sign.ps1
# for every build; without the SELEKYT_AZURE_* secrets the script logs
# SELEKYT_UNSIGNED and exits 0, and the artifact is named "unsigned" below so
# the release notes cannot drift from the truth. Set the secrets and the same
# job signs and verifies instead — no config change, no second pipeline.

# A push to main while this is running would cancel a build that is minutes
# into a Windows compile and a ~1 GB download, and the run that replaced it
# would then pay both costs again. Only a manual re-run of the same ref should
# supersede one that is already in flight.
concurrency:
  group: build-windows-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Host tooling for the staging script: archive handling, the GitHub API
      # query that resolves the python-build-standalone release, and the
      # end-to-end sidecar ping.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the mech workspace
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Cache the Tauri shell workspace
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Stage sidecars and bundled resources
        shell: bash
        env:
          # Lifts the unauthenticated GitHub API rate limit while the script
          # resolves the python-build-standalone release to download.
          GH_TOKEN: ${{ github.token }}
        run: bash apps/desktop/stage-windows.sh

      - name: Install the Tauri CLI
        working-directory: apps/desktop
        run: npm install

      - name: Build the Windows installers
        id: build
        working-directory: apps/desktop
        # The signing hook reads these. They are empty until the repository
        # secrets exist, which is what keeps this job able to ship an honestly
        # labelled unsigned build today.
        #
        # The log is teed to a file because the next step has to know whether
        # sign.ps1 declined to sign, and $GITHUB_STEP_LOG points at *its own*
        # step log, not this one. When that was the grep target the marker was
        # never found and every unsigned build uploaded as "signed" — the exact
        # The path is declared here AND on the labelling step below. GitHub step
        # `env:` does not leak to sibling steps, so a single declaration leaves
        # one of the two reading an empty string — which is what failed run
        # 35543527611, where the labelling step's `grep -c` errored on the
        # missing filename, wrote nothing to stdout, `$marker` came back empty
        # rather than 0, and `[ "" -gt 0 ]` was a bash type error rather than a
        # comparison that fell through to the fail-closed branch.
        #
        # It is not on the *job*, despite that being the natural "visible to
        # every step" place: the runner context is unavailable in job-level env,
        # and putting it there makes GitHub reject the whole workflow file before
        # any job runs — run 35545641450 died at parse time with "Unrecognized
        # named-value: 'runner'" and zero jobs executed.
        env:
          SELEKYT_BUILD_LOG: ${{ runner.temp }}/selekyt-build.log
          SELEKYT_AZURE_TENANT_ID: ${{ secrets.SELEKYT_AZURE_TENANT_ID }}
          SELEKYT_AZURE_CLIENT_ID: ${{ secrets.SELEKYT_AZURE_CLIENT_ID }}
          SELEKYT_AZURE_CLIENT_SECRET: ${{ secrets.SELEKYT_AZURE_CLIENT_SECRET }}
          SELEKYT_AZURE_KEY_VAULT_URI: ${{ secrets.SELEKYT_AZURE_KEY_VAULT_URI }}
          SELEKYT_AZURE_CERT_NAME: ${{ secrets.SELEKYT_AZURE_CERT_NAME }}
        shell: bash
        run: |
          set -o pipefail
          npx tauri build --bundles nsis,msi 2>&1 | tee "$SELEKYT_BUILD_LOG"

      - name: Record whether the build was signed
        id: signed
        shell: bash
        # Its own copy of the path: step env does not cross steps, and the job
        # cannot hold it either (see the build step above).
        env:
          SELEKYT_BUILD_LOG: ${{ runner.temp }}/selekyt-build.log
        # sign.ps1 emits the greppable marker when it declines to sign. A build
        # that intended to sign but could not fails the job instead, so the only
        # way to reach this step unsigned is "no credentials configured".
        #
        # Fail closed. The marker and the presence of the credentials must agree:
        # a missing marker with no credentials would mean the hook never ran at
        # all, and naming that build "signed" is the one thing this workflow
        # must not do.
        run: |
          # The log must exist and be readable. If it does not, refuse rather
          # than guess: an unset SELEKYT_BUILD_LOG makes grep error and print
          # nothing, which turns `[ "$marker" -gt 0 ]` into a bash type error
          # rather than a comparison — the same failure that cost run
          # 35543527611, when only the build step declared the path.
          if [ ! -s "$SELEKYT_BUILD_LOG" ]; then
            echo "::error::the build log at SELEKYT_BUILD_LOG='$SELEKYT_BUILD_LOG' is missing or empty, so the signing marker cannot be checked."
            exit 1
          fi
          marker="$(grep -c 'SELEKYT_UNSIGNED' "$SELEKYT_BUILD_LOG" || true)"
          marker="${marker:-0}"
          creds="${{ secrets.SELEKYT_AZURE_TENANT_ID != '' }}"
          echo "marker hits: $marker; credentials configured: $creds"
          if [ "$marker" -gt 0 ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::this build is UNSIGNED; Windows SmartScreen will warn"
          elif [ "$creds" = "true" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::sign.ps1 did not report SELEKYT_UNSIGNED and no Azure credentials are configured, so signing cannot have happened. Refusing to name this build signed."
            exit 1
          fi

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signed.outputs.signed == 'true' && 'selekyt-windows-x64-signed' || 'selekyt-windows-x64-unsigned' }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          # They are already compressed; recompressing them costs minutes and
          # bytes for nothing.
          compression-level: 0
          retention-days: 30
