name: Publish to PyPI

# Triggered by a version tag and nothing else. The tag is what a maintainer
# types to ship a release, and the jobs below exist so that typing it cannot
# reach PyPI unless the release actually builds and passes.
on:
  push:
    tags:
      - "v*"

# A tag pushed by mistake, or pushed before a fix landed, must not be able to
# publish. Every job here is a gate the publish job waits on, and the publish
# job itself only runs when all of them succeeded — `if: success()` is
# belt-and-braces against a `needs:` graph that a future edit might loosen.
# No `continue-on-error` appears anywhere below; a step that could fail must
# not be able to look like a pass.
jobs:
  # ── the gate: the same acceptance the release claims ─────────────────────
  #
  # This is not a re-run of CI for politeness. A wheel that has never been
  # installed in a clean environment has never been tested as a wheel: an
  # editable install puts the source tree on sys.path, which hides a missing
  # package-data file, a bad top_level, or an entry point that only resolves
  # against the checkout. So the gate builds the wheel, installs it into a
  # venv nothing else has touched, and runs the suite against that install.
  acceptance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the Rust sidecar
        # The wheel vendors the sidecar at engine/bin/selekyt-mech, and the
        # parity test spawns the binary it resolves. Building here rather than
        # trusting the checked-in copy means the release verifies the Cargo
        # workspace in rust/ actually compiles from the tag's own source.
        working-directory: rust
        run: cargo build --release --locked

      - name: Stage the release assets
        # Copies the built sidecar to the path the wheel ships it from, and
        # verifies the bundled models are present. Fails the job with a message
        # naming whatever is missing rather than building a wheel that silently
        # lacks it.
        run: python tools/prepare_release_assets.py

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ffmpeg / ffprobe
        # The acceptance run exercises the real render path, which needs a
        # system ffmpeg to remain on PATH as the first-choice resolver.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install the fonts the caption-burn coverage check resolves
        # This job runs the full suite, including the Telugu end-to-end. The
        # render refuses to burn captions no installed font can draw
        # (engine/render.py, _check_caption_coverage), and the hosted image has
        # no Indic font, so without this the gate fails on a host limitation
        # rather than on the artifact it is there to judge. Same package the
        # refusal message names; see the matching step in ci.yml.
        run: sudo apt-get install -y --no-install-recommends fonts-noto-core

      - name: Build the wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Install the wheel in a clean venv
        # The wheel's own METADATA drives the dependency resolution: this is the
        # clean-install contract, exercised against the built artifact rather
        # than the source tree an editable install would put on sys.path.
        run: |
          python -m venv /tmp/acceptance
          /tmp/acceptance/bin/pip install --upgrade pip
          /tmp/acceptance/bin/pip install dist/*.whl
          # The extras the acceptance suite needs beyond the package's own base
          # dependencies, plus a builder. These are named explicitly rather than
          # as `selekyt[dev]` for a reason: a requirement *by name* resolves
          # from the index, and the index already carries a published selekyt
          # (0.3.1 today), so that spelling silently installs the released
          # package instead of the wheel this job just built and tests an
          # artifact the release never shipped. Attaching the extra to the
          # local path is not the answer either — `dist/*.whl[dev]` is a shell
          # character class that matches no file, and quoting it makes pip read
          # the glob literally (verified: "Invalid wheel filename: '*'").
          # `build` is what tests/test_pypi_packaging.py invokes to construct
          # the wheel its assertions inspect — without it those tests *skip*,
          # which would turn a broken package-data glob into a green run.
          /tmp/acceptance/bin/pip install pytest build pyyaml huggingface_hub \
            requests "pillow>=10"
      - name: Node (for the web shell harness tests)
        # The acceptance run is the full suite, and 13 of its tests drive the
        # desktop shell through web/server.mjs. The hosted image ships node, so
        # this documents the requirement and fails here rather than as a wall of
        # sidecar tracebacks if a future image drops it.
        run: node --version

      - name: The installed package imports and its CLI answers
        run: |
          /tmp/acceptance/bin/python -c "import engine, providers, selekyt; print('imports ok')"
          /tmp/acceptance/bin/selekyt --version

      - name: The bundled whisper model resolves from the installed wheel
        # The whole point of bundling: an installed copy must hand WhisperModel
        # a directory, not a size name it would download.
        run: |
          /tmp/acceptance/bin/python - <<'PY'
          import pathlib
          from providers.whisper import resolve_model_path
          resolved = pathlib.Path(resolve_model_path("tiny"))
          assert resolved.is_dir(), f"tiny did not resolve to a directory: {resolved}"
          assert (resolved / "model.bin").is_file(), "no model.bin beside it"
          print(f"installed wheel resolves tiny -> {resolved}")
          PY

      - name: The bundled sidecar answers a ping from the installed wheel
        run: |
          /tmp/acceptance/bin/python - <<'PY'
          from providers.sidecar import sidecar_path, ping
          print("installed sidecar ->", sidecar_path())
          data = ping()
          assert data.get("pong") is True, f"sidecar did not answer a ping: {data}"
          PY

      - name: Run the suite against the installed wheel
        # -rs so a skipped suite cannot pass as green without a reason printed.
        run: |
          /tmp/acceptance/bin/python -m pytest tests/ -q -rs
        env:
          SELEKYT_MECH: ${{ github.workspace }}/engine/bin/selekyt-mech

      - name: Assert the wheel's release-only contents
        # SELEKYT_RELEASE_BUILD turns on the assertions that the built wheel
        # actually carries the weights, the sidecar and the vendored reader.
        # Without it those assert nothing, and a package-data glob that stopped
        # matching would ship a wheel that silently degrades.
        run: |
          /tmp/acceptance/bin/python -m pytest tests/test_pypi_packaging.py -q
        env:
          SELEKYT_RELEASE_BUILD: "1"

  # ── the version the tag claims is the version that ships ────────────────
  #
  # A tag pushed from a tree whose pyproject.toml disagrees ships a build
  # whose METADATA lies about its own version, which is how a downstream
  # resolves the wrong release. This fails before anything is uploaded.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag must match the declared version
        # The tag is read from REF rather than argv: a heredoc gives python no
        # arguments (argv is exactly ['-']), so argv[1] would raise IndexError
        # and fail this gate on every well-formed tag.
        run: |
          python - <<'PY'
          import os, re, tomllib
          declared = tomllib.load(open("pyproject.toml","rb"))["project"]["version"]
          tag = re.sub(r"^v", "", os.environ["REF"])
          if tag != declared:
              raise SystemExit(f"tag v{tag} does not match pyproject.toml "
                               f"version {declared!r}; the tag would publish a "
                               "build whose METADATA disagrees with the tag")
          print(f"tag matches declared version {declared}")
          PY
        env:
          REF: ${{ github.ref_name }}
      - name: The version must not already be published
        # A version that is already on PyPI cannot be uploaded again — the
        # publish job would fail at the upload after ~20 minutes of building.
        # Failing here names the collision in seconds and points at the fix:
        # bump pyproject.toml and retag. A missing package or a network problem
        # is not a release blocker, only an unpublishable one, so only an
        # actual existing release of *this* version exits nonzero.
        run: |
          python - <<'PY'
          import json, tomllib, urllib.request
          declared = tomllib.load(open("pyproject.toml","rb"))["project"]["version"]
          # The network read is the only part that may fail softly; the assertion
          # must stay outside the try or its AssertionError is swallowed.
          try:
              with urllib.request.urlopen("https://pypi.org/pypi/selekyt/json",
                                          timeout=20) as r:
                  published = set(json.load(r)["releases"])
          except Exception as exc:
              print(f"could not reach PyPI ({exc}); skipping the published check")
          else:
              assert declared not in published, (
                  f"version {declared} is already published to PyPI; bump "
                  "pyproject.toml and retag rather than reusing a release")
              print(f"version {declared} is not yet published "
                    f"(existing: {sorted(published)})")
          PY

  # ── build the artifact that will actually be uploaded ────────────────────
  build:
    needs: [acceptance, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the Rust sidecar
        working-directory: rust
        run: cargo build --release --locked
      - name: Stage the release assets
        # --check: nothing is staged here, this only refuses to proceed until
        # every asset a user's first run depends on is present and named.
        run: python tools/prepare_release_assets.py --check
      - name: Build the distribution
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Inspect the wheel payload and metadata
        # The contract the release claims, checked against the artifact rather
        # than the tree: the models, the weights, the sidecar, the vendored
        # reader, and the dependency declarations a clean install resolves
        # against.
        run: |
          python - <<'PY'
          import zipfile, glob
          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as z:
              names = set(z.namelist())
              required = {
                  "engine/models/silero_vad_v6.onnx",
                  "engine/models/face_detection_yunet.onnx",
                  "engine/models/whisper_tiny/model.bin",
                  "engine/models/whisper_tiny/tokenizer.json",
                  "engine/models/whisper_tiny/config.json",
                  "engine/bin/selekyt-mech",
                  "third_party/otio_fcpxml_adapter/fcpxml.py",
                  "third_party/otio_fcpxml_adapter/LICENSE",
              }
              missing = sorted(required - names)
              assert not missing, f"missing from the wheel: {missing}"
              meta = z.read(next(n for n in names if n.endswith(".dist-info/METADATA"))).decode()
              for dep in ("faster-whisper", "av", "onnxruntime", "static-ffmpeg",
                          "pycmx", "opentimelineio"):
                  assert f"Requires-Dist: {dep}" in meta, f"{dep} missing from METADATA"
              # The pin that keeps faster-whisper 1.2.1 runnable: PyAV 19 removed
              # the argument it calls av.open() with.
              assert "Requires-Dist: av<19,>=11" in meta, "the av<19 upper bound is not in METADATA"
          print("wheel contract: PASS")
          PY
      - name: Record the built artifacts
        run: ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  # ── the real product, on real media, from the built wheel ────────────────
  #
  # Everything above proves the wheel is well-formed. This proves the thing a
  # user installs actually works: it installs the artifact built by the `build`
  # job into a venv that has never seen the checkout, points it at a real
  # downloadable speech video, and takes the installed CLI through
  # transcription, story, render, captions and timeline interchange. Nothing
  # here is mocked, and no path comes from the source tree.
  real-media:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg / ffprobe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Download the built wheel
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install only the built wheel into a clean environment
        run: |
          rm -rf /tmp/selekyt-clean
          python -m venv /tmp/selekyt-clean
          /tmp/selekyt-clean/bin/python -m pip install --upgrade pip
          /tmp/selekyt-clean/bin/python -m pip install dist/*.whl
          /tmp/selekyt-clean/bin/python -m pip install "pytest>=8"
      - name: Prove the installed runtime
        # Run from /tmp so the checkout cannot supply anything the wheel did
        # not. The VAD chain must resolve to silero — the top of the measured
        # fallback order, not the ffmpeg rung.
        run: |
          cd /tmp
          /tmp/selekyt-clean/bin/python - <<'PY'
          import engine, selekyt
          import onnxruntime, faster_whisper, pycmx, opentimelineio, static_ffmpeg
          from engine.vad import SileroVADBackend, get_vad_backend
          from selekyt.runtime import bundled_mech_path, bundled_whisper_model, ping_mech
          # engine ships as a namespace package, so engine.__file__ is None and
          # an "in engine.__file__" check raises instead of asserting anything.
          # selekyt is a regular package installed beside it, so its directory is
          # where both came from — had the checkout leaked onto sys.path, that
          # directory would be the source tree rather than this venv.
          import os as _os
          _pkgs = _os.path.dirname(_os.path.dirname(selekyt.__file__))
          assert "/home/runner/work/" not in _pkgs, \
              f"selekyt resolved from {_pkgs}, the checkout rather than the wheel"
          assert _os.path.isdir(_os.path.join(_pkgs, "engine")), \
              "engine is not installed beside selekyt"
          assert SileroVADBackend().is_available(), "silero VAD backend unavailable"
          assert get_vad_backend().name == "silero", \
              f"VAD resolved to {get_vad_backend().name}, not silero"
          assert bundled_whisper_model() is not None, "no bundled whisper model"
          assert bundled_mech_path() is not None, "no bundled sidecar"
          assert ping_mech()["pong"] is True, "sidecar did not answer a ping"
          print("installed runtime: PASS")
          PY
          /tmp/selekyt-clean/bin/selekyt --version
          /tmp/selekyt-clean/bin/selekyt --doctor
      - name: Run the installed Silero regression suite
        run: |
          cd /tmp
          /tmp/selekyt-clean/bin/python -m pytest "$GITHUB_WORKSPACE/tests/test_vad_silero.py" -q
      - name: Download real speech video
        run: |
          curl -L --fail --retry 3 \
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/Philip%20Nelson%20Interview.webm" \
            -o /tmp/release-real.webm
          ffmpeg -y -v error -ss 0 -t 45 -i /tmp/release-real.webm -c copy /tmp/release-sample.webm
      - name: Run the real local end-to-end product
        # --model tiny forces the bundled model, which is what this run exists
        # to prove: the wheel's own weights, transcribing real speech, with no
        # download and no source tree in reach.
        run: |
          cd /tmp
          /tmp/selekyt-clean/bin/selekyt /tmp/release-sample.webm \
            --model tiny --limit 1 --audio-analysis --out /tmp/release-e2e
          test -f /tmp/release-e2e/project/facebook/01.mp4
          test -f /tmp/release-e2e/project/shorts/01.mp4
          test -f /tmp/release-e2e/project/timeline/01.edl
          test -f /tmp/release-e2e/project/timeline/01.fcpxml
          test -f /tmp/release-e2e/project/captions/01.ass
          /tmp/selekyt-clean/bin/python "$GITHUB_WORKSPACE/tools/nle_check.py" /tmp/release-e2e/project | tee /tmp/nle-check.txt
          # An independent validator that skipped proved nothing. A SKIP here
          # means pycmx or the FCPXML reader was unavailable, which is a
          # release failure, not a pass.
          ! grep -q "SKIP" /tmp/nle-check.txt
          # Fail closed on the runtime warnings that mean the install degraded
          # silently instead of using the bundled runtime it ships.
          if grep -RqiE "pycmx (absent|missing)|FCPXML reader (absent|missing)|vad ffmpeg" /tmp/release-e2e/project; then
            echo "release-critical runtime warning found"
            exit 1
          fi
      - name: The deliverables are non-empty and correctly shaped
        # A zero-byte EDL or an empty FCPXML passes the file-exists checks
        # above; the interchange files must carry real events.
        run: |
          set -e
          for f in /tmp/release-e2e/project/timeline/01.edl /tmp/release-e2e/project/timeline/01.fcpxml /tmp/release-e2e/project/captions/01.ass; do
            test -s "$f" || { echo "$f is empty"; exit 1; }
          done
          /tmp/selekyt-clean/bin/python - <<'PY'
          import pathlib, re
          root = pathlib.Path("/tmp/release-e2e/project")
          edl = (root / "timeline/01.edl").read_text()
          fcpxml = (root / "timeline/01.fcpxml").read_text()
          assert re.search(r"^\s*(TITLE|FCM:)", edl, re.M), "EDL has no TITLE record"
          assert "<fcpxml" in fcpxml, "FCPXML is not an FCPXML document"
          assert "spine" in fcpxml, "FCPXML has no spine — no clip was placed"
          print("deliverable shape: PASS")
          PY

  # ── publish, only after every gate above went green ──────────────────────
  publish:
    needs: [build, real-media]
    runs-on: ubuntu-latest
    # Both guards: `needs` is the graph, `success()` survives a future edit
    # that reorders it.
    if: success()
    environment:
      name: pypi
      url: https://pypi.org/p/selekyt
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish the already-tested distribution
        uses: pypa/gh-action-pypi-publish@release/v1
