[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selekyt"
version = "0.3.0"
description = "Local-first long-form to publishable social video editorial engine"
requires-python = ">=3.10"
dependencies = ["opencv-python-headless>=4.9", "numpy>=1.26", "yt-dlp>=2026.8.19"]

[project.optional-dependencies]
# faster-whisper is the preferred engine (attention-based, per-token
# timestamps); sherpa-onnx is the fallback for hosts with no ctranslate2
# wheel, e.g. Termux ARM64. Neither is a base dependency.
transcription = ["faster-whisper>=1.1"]
sherpa = ["sherpa-onnx>=1.10"]
llm = ["requests>=2.31"]
# pycmx is an independent CMX 3600 reader. tools/nle_check.py uses it to parse
# SelekyT's own EDL output with a parser SelekyT did not write, which is the
# only check in the suite that can catch a self-consistent-but-wrong emitter.
# Without it the check fails loudly rather than skipping, so this extra is
# installed in CI.
nle = ["pycmx>=1.5"]
dev = ["pytest>=8", "pycmx>=1.5"]
all = ["faster-whisper>=1.1", "sherpa-onnx>=1.10", "requests>=2.31", "pycmx>=1.5"]

[project.scripts]
selekyt = "selekyt.cli:main"

[tool.setuptools.packages.find]
include = ["selekyt*", "engine*", "models*", "providers*"]
