[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selekyt"
version = "0.2.0"
description = "Local-first long-form to publishable social video editorial engine"
requires-python = ">=3.10"
dependencies = ["opencv-python-headless>=4.9", "numpy>=1.26", "yt-dlp>=2026.8.19"]

[project.optional-dependencies]
transcription = ["faster-whisper>=1.1"]
llm = ["requests>=2.31"]
dev = ["pytest>=8"]
all = ["faster-whisper>=1.1", "requests>=2.31"]

[project.scripts]
selekyt = "selekyt.cli:main"

[tool.setuptools.packages.find]
include = ["selekyt*", "engine*", "models*", "providers*"]
