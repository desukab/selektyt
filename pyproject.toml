[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "selekyt"
version = "0.4.0"
description = "Local-first long-form to publishable social video editorial engine"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-SeleKyT-NonCommercial-Source-Available"
license-files = ["LICENSE"]
# Local transcription is part of the base product, not an opt-in: the wheel
# bundles the whisper tiny weights precisely so a bare ``pip install selekyt``
# transcribes offline, and an install that ships those weights without the
# library that loads them ships dead weight. faster-whisper, the pinned PyAV,
# onnxruntime (the silero VAD and YuNet face detector), and static-ffmpeg (a
# usable ffmpeg/ffprobe on a host with no system one) therefore all sit here.
#
# The ``av`` pin is load-bearing: faster-whisper 1.2.1 calls
# ``av.open(..., metadata_errors="ignore")`` (faster_whisper/audio.py), and
# PyAV 19 removed that argument — so an unpinned resolve pulls av 19 and every
# transcription dies on the first chunk with an unexpected keyword argument.
# faster-whisper declares only ``av>=11``, so the upper bound has to come from
# here. Lift it when faster-whisper releases a build that speaks the PyAV 19 API.
#
# pycmx and opentimelineio are base because the readers they provide are
# release-critical: the independent EDL/FCPXML validation in tools/nle_check.py
# must find them installed, and a dependency a gate depends on belongs where the
# gate can rely on it.
#
# The cloud transcription clients and the system credential store they read a
# key from are imported lazily and guarded with an install hint naming their
# extra, so they stay optional: a base install must reach ``selekyt --help``
# and a full local run without any of them.
dependencies = [
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "yt-dlp>=2026.8.19",
  "faster-whisper>=1.1",
  "av>=11,<19",
  "onnxruntime>=1.18.0",
  "static-ffmpeg>=3.0",
  "pycmx>=1.5",
  "opentimelineio>=0.17.0",
]

[project.optional-dependencies]
# Compatibility alias: local transcription is base now, but existing
# installation commands that name this extra must keep resolving.
transcription = ["faster-whisper>=1.1", "av>=11,<19"]
# The fallback transcription backend for hosts with no ctranslate2 wheel,
# e.g. Termux ARM64.
sherpa = ["sherpa-onnx>=1.10"]
llm = ["requests>=2.31"]
cloud-transcription = ["groq>=0.31", "google-genai>=2.0,<3", "keyring>=25"]
# Independent timeline readers are production validation dependencies now.
nle = ["pycmx>=1.5", "opentimelineio>=0.17.0"]
dev = ["pytest>=8", "pyyaml>=6", "huggingface_hub>=0.23", "static-ffmpeg>=3.0"]
all = ["sherpa-onnx>=1.10", "requests>=2.31",
       "groq>=0.31", "google-genai>=2.0,<3", "keyring>=25"]

[project.scripts]
selekyt = "selekyt.cli:main"

[tool.setuptools.packages.find]
include = ["selekyt*", "engine*", "models*", "providers*", "third_party*"]

# Vendored third-party FCPXML reader (Apache-2.0); origin and licence are
# recorded in third_party/PROVENANCE.md. It needs its licence file beside it for
# Apache-2.0 redistribution, and the provenance record ships with it so the
# origin claim travels with the wheel instead of only living in the repo.
#
# engine/models/ holds the silero VAD v6 and YuNet face-detection ONNX weights
# (1.5 MB, both MIT — see the licences beside them). They are not optional data
# a user can fetch: engine/vad.py and engine/reframe_perception.py resolve them
# relative to __file__, and without them the preferred VAD backend and the face
# detector both fall back to weaker paths on a machine that otherwise has
# onnxruntime. A wheel that ships the code that loads a model without the model
# is a wheel that silently degrades on first use, so they travel with the
# package. Their licences and provenance ship beside them for the same reason
# the FCPXML reader's do.
#
# engine/models/whisper_tiny/ is the same argument one level up: the tiny
# whisper weights (75 MB, MIT) are the last entry in the transcription fallback
# chain, so a run that has already given up on small and base lands on them.
# Leaving that stop as a download means a run with audio already extracted can
# still die on a connection error. See engine/models/whisper_tiny/PROVENANCE.md
# for the origin record. model.bin is the overwhelming majority of the wheel;
# the three sidecar files are needed to construct the model from a directory.
#
# engine/bin/selekyt-mech is the compiled Rust sidecar. It is a Linux x86_64
# binary inside a platform-agnostic wheel, which is deliberate: nothing on the
# pipeline's critical path requires it (providers/sidecar.py resolves to None
# and callers degrade), so tagging the wheel linux_x86_64 would deny the
# editorial engine to aarch64 and macOS hosts for the sake of a binary they
# would never run.
[tool.setuptools.package-data]
engine = ["assets/fonts/*.ttf", "assets/licenses/OFL-Fredoka.txt",
          "models/*.onnx", "models/*.LICENSE", "models/*.PROVENANCE.md",
          "models/whisper_tiny/model.bin", "models/whisper_tiny/config.json",
          "models/whisper_tiny/tokenizer.json", "models/whisper_tiny/vocabulary.txt",
          "models/whisper_tiny/LICENSE", "models/whisper_tiny/PROVENANCE.md",
          "bin/selekyt-mech"]
third_party = ["PROVENANCE.md"]
"third_party.otio_fcpxml_adapter" = ["LICENSE"]
