[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selekyt"
version = "0.3.0"
description = "Local-first long-form to publishable social video editorial engine"
requires-python = ">=3.10"
dependencies = ["opencv-python-headless>=4.9", "numpy>=1.26", "yt-dlp>=2026.8.19"]

[project.optional-dependencies]
# faster-whisper is the preferred engine (attention-based, per-token
# timestamps); sherpa-onnx is the fallback for hosts with no ctranslate2
# wheel, e.g. Termux ARM64. Neither is a base dependency.
transcription = ["faster-whisper>=1.1"]
sherpa = ["sherpa-onnx>=1.10"]
llm = ["requests>=2.31"]
cloud-transcription = ["groq>=0.31", "google-genai>=2.0,<3", "keyring>=25"]
# pycmx is an independent CMX 3600 reader, and the vendored
# otio_fcpxml_adapter (see third_party/PROVENANCE.md) is an independent FCPXML
# reader. tools/nle_check.py uses both to parse SelekyT's own EDL and FCPXML
# output with parsers SelekyT did not write, which is the only kind of check
# that can catch a self-consistent-but-wrong emitter — a writer and a validator
# drawn from the same codebase cannot see each other's mistakes. Without either
# the corresponding check fails loudly rather than skipping, so this extra is
# installed in CI. opentimelineio is a build-time requirement of the FCPXML
# reader only, so it stays out of the base install.
nle = ["pycmx>=1.5", "opentimelineio>=0.17.0"]
# pyyaml reads the release workflows in tests/test_desktop_packaging.py, which
# pins the signed/unsigned label against the YAML that actually ships the
# installer. Without it those tests error at collection on a clean checkout
# rather than silently not running, which is worse than a skip but still a red
# CI for a dependency reason. opentimelineio is here for the same reason as
# pycmx: the corpus interchange sweep importorskips the readers, and a CI that
# skips them is a CI that never exercised the independent FCPXML parse.
# huggingface_hub is the library whose cache layout the staged installer ships,
# and tests/test_collapse_hub_cache.py asks the installed library to resolve a
# collapsed cache offline — a fixture imitating the format would only ever test
# the imitation, so this extra keeps that check live in CI instead of skipping.
dev = ["pytest>=8", "pycmx>=1.5", "opentimelineio>=0.17.0", "pyyaml>=6",
       "huggingface_hub>=0.23"]
all = ["faster-whisper>=1.1", "sherpa-onnx>=1.10", "requests>=2.31", "pycmx>=1.5",
       "opentimelineio>=0.17.0"]

[project.scripts]
selekyt = "selekyt.cli:main"

[tool.setuptools.packages.find]
include = ["selekyt*", "engine*", "models*", "providers*", "third_party*"]

# Vendored third-party FCPXML reader (Apache-2.0); origin and licence are
# recorded in third_party/PROVENANCE.md. It needs its licence file beside it for
# Apache-2.0 redistribution, and the provenance record ships with it so the
# origin claim travels with the wheel instead of only living in the repo.
[tool.setuptools.package-data]
engine = ["assets/fonts/*.ttf", "assets/licenses/OFL-Fredoka.txt"]
third_party = ["PROVENANCE.md"]
"third_party.otio_fcpxml_adapter" = ["LICENSE"]
