[build-system]
requires = ["setuptools>=77.0.3", "wheel>=0.45", "huggingface_hub>=0.23"]
build-backend = "setuptools.build_meta"

[project]
name = "selekyt"
version = "0.4.0"
description = "Local-first long-form to publishable social video editorial engine"
readme = "README.md"
requires-python = ">=3.10"
platforms = ["Linux x86_64"]
license = "LicenseRef-SeleKyT-NonCommercial-Source-Available"
license-files = ["LICENSE"]
dependencies = [
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "yt-dlp>=2026.8.19",
  "faster-whisper>=1.1",
  "av>=11,<19",
  "onnxruntime>=1.18.0",
  "pycmx>=1.5",
  "opentimelineio>=0.17.0",
  "static-ffmpeg>=3.0",
]

[project.optional-dependencies]
# Local transcription is part of the base product. This extra remains as a
# compatibility alias for existing installation commands.
transcription = ["faster-whisper>=1.1", "av>=11,<19"]
sherpa = ["sherpa-onnx>=1.10"]
llm = ["requests>=2.31"]
cloud-transcription = ["groq>=0.31", "google-genai>=2.0,<3", "keyring>=25"]
# Independent timeline readers are production validation dependencies now.
nle = ["pycmx>=1.5", "opentimelineio>=0.17.0"]
dev = ["pytest>=8", "pycmx>=1.5", "opentimelineio>=0.17.0", "pyyaml>=6",
       "huggingface_hub>=0.23"]
all = [
  "sherpa-onnx>=1.10",
  "groq>=0.31",
  "google-genai>=2.0,<3",
  "keyring>=25",
  "requests>=2.31",
]

[project.scripts]
selekyt = "selekyt.cli:main"

[tool.setuptools.packages.find]
include = ["selekyt*", "engine*", "models*", "providers*", "third_party*"]

[tool.setuptools.package-data]
engine = ["assets/fonts/*.ttf", "assets/licenses/OFL-Fredoka.txt",
          "models/*.onnx", "models/*.LICENSE", "models/*.PROVENANCE.md"]
selekyt = ["assets/whisper/tiny/*", "assets/bin/linux-x86_64/*"]
third_party = ["PROVENANCE.md"]
"third_party.otio_fcpxml_adapter" = ["LICENSE"]
