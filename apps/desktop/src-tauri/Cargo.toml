[package]
name = "selekyt-desktop-shell"
version = "0.3.0"
description = "SelekyT desktop webview shell — local-first video editorial engine"
authors = ["SelekyT Project"]
edition = "2021"
rust-version = "1.77"

# The binary is the desktop app proper; the intelligence layer is a bundled
# Python sidecar and the mechanical core is the `selekyt-mech` Rust sidecar.
# Both are declared as Tauri externalBin sidecars in ../tauri.conf.json so the
# webview can execute exactly those two programs and nothing else.
[[bin]]
name = "SelekyT"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# `custom-protocol` makes Tauri embed ../web into the release binary via
# generate_context!, i.e. the shipped app needs no dev server and no network.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
